worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    client_max_body_size 10m;

    # Таймауты поменьше, чтобы ошибки сервиса быстро отдавались в UI
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;

    upstream web_upstream    { server web:8080; }
    upstream auth_upstream   { server auth-svc:8001; }
    upstream forms_upstream  { server forms-svc:8002; }
    upstream records_upstream { server records-svc:8003; }
    upstream materials_upstream { server materials-svc:8004; }
    upstream scheduler_upstream { server scheduler-svc:8005; }
    upstream audit_upstream  { server audit-svc:8006; }

    server {
        listen 80;

        # API сервисов: /api/<service>/... -> /... внутри сервиса
        location /api/auth/        { proxy_pass http://auth_upstream/; }
        location /api/forms/       { proxy_pass http://forms_upstream/; }
        location /api/records/     { proxy_pass http://records_upstream/; }
        location /api/materials/   { proxy_pass http://materials_upstream/; }
        location /api/notifications/ { proxy_pass http://scheduler_upstream/; }
        location /api/audit/       { proxy_pass http://audit_upstream/; }

        # React-SPA
        location / {
            proxy_pass http://web_upstream;
        }
    }
}
