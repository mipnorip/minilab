worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    client_max_body_size 10m;

    # DNS Docker: адреса сервисов резолвятся динамически (актуальны после recreate)
    resolver 127.0.0.11 valid=10s ipv6=off;

    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;

    server {
        listen 80;

        # API сервисов: /api/<service>/... -> /... внутри сервиса
        # (set до rewrite: break прерывает фазу rewrite и последующий set не выполнится)
        location /api/auth/ {
            set $target "auth-svc:8001";
            rewrite ^/api/auth/(.*)$ /$1 break;
            proxy_pass http://$target;
        }
        location /api/forms/ {
            set $target "forms-svc:8002";
            rewrite ^/api/forms/(.*)$ /$1 break;
            proxy_pass http://$target;
        }
        location /api/records/ {
            set $target "records-svc:8003";
            rewrite ^/api/records/(.*)$ /$1 break;
            proxy_pass http://$target;
        }
        location /api/materials/ {
            set $target "materials-svc:8004";
            rewrite ^/api/materials/(.*)$ /$1 break;
            proxy_pass http://$target;
        }
        location /api/notifications/ {
            set $target "scheduler-svc:8005";
            rewrite ^/api/notifications/(.*)$ /$1 break;
            proxy_pass http://$target;
        }
        location /api/audit/ {
            set $target "audit-svc:8006";
            rewrite ^/api/audit/(.*)$ /$1 break;
            proxy_pass http://$target;
        }

        # React-SPA
        location / {
            set $target "web:8080";
            proxy_pass http://$target;
        }
    }
}
